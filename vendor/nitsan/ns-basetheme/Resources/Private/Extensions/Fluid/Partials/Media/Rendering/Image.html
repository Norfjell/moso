<picture>
	<source
	  srcset="{f:uri.image(image: '{file}', maxWidth: '1920', cropVariant: 'default')}"
	  media="(min-width: 1200px)">
	<source
	  srcset="{f:uri.image(image: '{file}', maxWidth: '1200', cropVariant: 'specialTablet')}"
	  media="(min-width: 768px)">
	<img
	  class="image-embed-item"
	  title="{file.title}"
	  srcset="
		{f:uri.image(image: '{file}', maxWidth: '600', cropVariant: 'specialMobile')} 1x,
		{f:uri.image(image: '{file}', maxWidth: '1200', cropVariant: 'specialMobile')} 2x"
	  sizes="(max-width: 768px) 300px, 600px"
	  width="300"
	  height="250"
	  alt="{file.alternative}" />
  </picture>
